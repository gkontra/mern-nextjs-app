<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .box {
        background-color: tomato;
        width: 100px;
        height: 100px;
        position: absolute;
        border-radius: 50%;
        border: 5px solid #222;
        animation-name: falling;
        animation-duration: 1s;
        animation-timing-function: cubic-bezier(0.23, 1.17, 0.73, 1.33);
        animation-fill-mode: both;

        transition: all 1s cubic-bezier(0.01, 0.74, 0.19, 0.78);
        &:hover {
          background-color: #222;
        }
      }

      @keyframes falling {
        from {
          bottom: 60%;
        }
        to {
          bottom: 200px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container py-5">
        <h1>Headline</h1>
        <div class="box"></div>
      </div>
    </main>
    <script>
      'use strict';
    </script>
  </body>
</html>
